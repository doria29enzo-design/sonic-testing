  - acceleration/deceleration and friction

  - jumping with momentum

// Continuous lower route: fills accidental holes between authored set pieces

(function fillLevelGaps(){
  const existing=[];
  for(const s of world.solids){ if(s.y>=500) existing.push([s.x,s.x+s.w]); }
  existing.sort((a,b)=>a[0]-b[0]);
  let cursor=0;
  for(const [a,b] of existing){
    if(a>cursor+2) world.solids.push({x:cursor,y:520,w:a-cursor,h:500});
    cursor=Math.max(cursor,b);
  }
  if(cursor<world.width) world.solids.push({x:cursor,y:520,w:world.width-cursor,h:500});
})();

function groundHeightAt(x){
  // Loop areas are handled separately.
  for(const s of world.slopes){
    const min=Math.min(s.x1,s.x2)-8,max=Math.max(s.x1,s.x2)+8;
    if(x>=min && x<=max){
      const t=(x-s.x1)/(s.x2-s.x1);
      return lerp(s.y1,s.y2,t);
    }
  }
  for(const s of world.solids){
    if(x>=s.x && x<=s.x+s.w && s.y<700) return s.y;
  }
  return 700;
}

function nearestLoop(){
  for(let i=0;i<world.loops.length;i++){
    const L=world.loops[i];
    const dx=p.x-L.cx,dy=(p.y+20)-L.cy;
    const d=Math.hypot(dx,dy);
    // Only attach when near the loop's track and moving sufficiently.
    if(Math.abs(d-L.r)<38 && Math.abs(p.vx)>4 && p.y<570)
      return {i,L,theta:Math.atan2(dy,dx)};
  }
  return null;
}

function cubicPoint(a,b,c,d,t){
  const u=1-t;
  return {
    x:u*u*u*a.x+3*u*u*t*b.x+3*u*t*t*c.x+t*t*t*d.x,
    y:u*u*u*a.y+3*u*u*t*b.y+3*u*t*t*c.y+t*t*t*d.y
  };
}

function prepareLoopTrack(L){
  if(L.track) return;
  const pts=[];
  // The physical loop begins with a curved lower-left entrance, reaches the
  // left wall, then uses a true circular surface for one full revolution.
  // This gives Sonic a continuous tangent instead of snapping from the floor
  // directly onto an invisible circle.
  const entry={x:L.cx-L.r-105,y:L.cy+L.r-8};
  const left={x:L.cx-L.r,y:L.cy};
  const c1={x:entry.x+65,y:entry.y};
  const c2={x:left.x,y:left.y+65};
  const entrySteps=36;
  for(let i=0;i<=entrySteps;i++) pts.push(cubicPoint(entry,c1,c2,left,i/entrySteps));

  const loopSteps=240;
  const startTheta=Math.PI;
  const endTheta=Math.PI*3;
  for(let i=1;i<=loopSteps;i++){
    const theta=lerp(startTheta,endTheta,i/loopSteps);
    pts.push({x:L.cx+Math.cos(theta)*L.r,y:L.cy+Math.sin(theta)*L.r});
  }

  const exit={x:L.cx+L.r+105,y:L.cy+L.r-8};
  const right={x:L.cx+L.r,y:L.cy};
  const e1={x:right.x,y:right.y+65};
  const e2={x:exit.x-65,y:exit.y};
  for(let i=1;i<=entrySteps;i++) pts.push(cubicPoint(right,e1,e2,exit,i/entrySteps));

  const dist=[0];
  for(let i=1;i<pts.length;i++) dist[i]=dist[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  L.track={pts,dist,total:dist[dist.length-1],loopStart:dist[entrySteps],loopEnd:dist[entrySteps+loopSteps]};
}

for(const L of world.loops) prepareLoopTrack(L);

function trackSample(L,d){
  const D=clamp(d,0,L.track.total);
  const ds=L.track.dist, pts=L.track.pts;
  let lo=0,hi=ds.length-1;
  while(lo<hi){
    const mid=(lo+hi)>>1;
    if(ds[mid]<D) lo=mid+1; else hi=mid;
  }
  const i=Math.max(1,lo), a=pts[i-1], b=pts[i];
  const span=Math.max(.0001,ds[i]-ds[i-1]);
  const t=(D-ds[i-1])/span;
  const x=lerp(a.x,b.x,t), y=lerp(a.y,b.y,t);
  const tx=(b.x-a.x)/span, ty=(b.y-a.y)/span;
  return {x,y,tx,ty,angle:Math.atan2(-ty,tx)};
}

function loopModeFromTangent(tx,ty){
  const a=((Math.atan2(-ty,tx)*180/Math.PI)%360+360)%360;
  if(a<45||a>=315)return 'floor';
  if(a<135)return 'right-wall';
  if(a<225)return 'ceiling';
  return 'left-wall';
}

function detachFromLoop(L,speed,trackPos,reason='slow'){
  const q=trackSample(L,trackPos);
  p.loopIndex=-1;
  p.loopDist=trackPos;
  p.grounded=false;
  p.jumping=true;
  p.rolling=true;
  // Keep the actual tangent momentum when Sonic falls off.
  p.vx=q.tx*speed;
  p.vy=q.ty*speed;
  if(reason==='jump') p.vy-=5.5;
  p.angle=0;
  return false;
}

function updateLoop(dt){
  if(p.loopIndex<0){
    let entry=-1,best=Infinity;
    for(let i=0;i<world.loops.length;i++){
      const L=world.loops[i]; prepareLoopTrack(L);
      const e=L.track.loopStart;
      const q=trackSample(L,e);
      const d=Math.hypot(p.x-q.x,(p.y+20)-q.y);
      const tangentDot=p.vx*q.tx+p.vy*q.ty;
      if(p.grounded && p.vx>6 && d<58 && tangentDot>3 && p.x>q.x-55 && p.x<q.x+55 && d<best){
        entry=i;best=d;
      }
    }
    if(entry<0) return false;
    const L=world.loops[entry];
    p.loopIndex=entry;
    p.loopDist=L.track.loopStart;
    p.groundSpeed=Math.max(6,p.vx);
    p.loopSpeed=p.groundSpeed;
    p.rolling=true;p.grounded=true;p.jumping=false;
  }

  const L=world.loops[p.loopIndex];
  let speed=p.groundSpeed;
  const q=trackSample(L,p.loopDist);
  const mode=loopModeFromTangent(q.tx,q.ty);
  const left=down('ArrowLeft'),right=down('ArrowRight');
  const dir=(right?1:0)-(left?1:0);

  // Classic 2D Sonic-style idea: keep one ground-speed scalar and project it
  // through the current surface tangent. Gravity changes that scalar according
  // to the tangent's vertical component. No invisible force carries Sonic.
  speed += PHYS.gravity*q.ty*0.95;
  if(dir) speed += dir*0.28;
  speed *= 0.999;
  speed=clamp(speed,-PHYS.boostMax,PHYS.boostMax);

  if((mode==='right-wall'||mode==='ceiling'||mode==='left-wall') && Math.abs(speed)<2.5)
    return detachFromLoop(L,speed,p.loopDist,'slow');
  if(hit(' ')) return detachFromLoop(L,speed,p.loopDist,'jump');

  p.groundSpeed=speed;p.loopSpeed=speed;
  p.loopDist+=speed*dt*60;

  if(p.loopDist>=L.track.loopEnd){
    const exitDist=Math.min(p.loopDist,L.track.total);
    const e=trackSample(L,exitDist);
    p.x=e.x;p.y=e.y-20;
    p.vx=Math.max(5,speed)*e.tx;
    p.vy=Math.max(5,speed)*e.ty;
    p.loopIndex=-1;p.grounded=true;p.jumping=false;p.rolling=true;p.angle=Math.atan2(-e.ty,e.tx);
    p.groundSpeed=speed;
    return false;
  }

  const pos=trackSample(L,p.loopDist);
  p.x=pos.x;p.y=pos.y-20;
  p.vx=speed*pos.tx;p.vy=speed*pos.ty;
  p.angle=Math.atan2(-pos.ty,pos.tx);
  p.grounded=true;p.jumping=false;p.rolling=true;
  return true;
}

function activateTimeSign(sign){
  // The post only arms time travel. It does NOT start the 3-second timer.
  // The player can touch the post, then build speed afterward.
  if(!sign || !sign.type) return;

  let destination=null;
  if(timeline === "present"){
    destination = sign.type;
  }else if(timeline === "past" && sign.type === "future"){
    destination = "present";
  }else if(timeline === "future" && sign.type === "past"){
    destination = "present";
  }else{
    // A same-direction sign is not valid in that timeline.
    return;
  }

  timeWarpSign={sign:sign,destination:destination};
  timeWarpTimer=0;
  spawnParticles(sign.x,sign.y,10);
  shake=3;
}

function updateTimeTravel(dt){
  if(timeWarpCooldown>0) timeWarpCooldown-=dt;
  if(timeWarpFlash>0) timeWarpFlash-=dt;

  // Run THROUGH a sign to activate it, just like Sonic CD.
  if(!timeWarpSign && timeWarpCooldown<=0){
    for(const s of world.timeSigns){
      const crossed = Math.abs(p.x-s.x)<30 && Math.abs((p.y+20)-s.y)<82 && Math.abs(p.vx)>2;
      if(crossed){ activateTimeSign(s); break; }
    }
  }
  if(!timeWarpSign) return;

  // Once the sign is active, the player needs real sustained momentum.
  // A small tolerance prevents a single frame of physics jitter from ruining
  // an otherwise successful 3-second run.
  const speed=Math.abs(p.vx);
  const enoughSpeed=speed>=7.6 && !p.spindash && !p.peel && !p.airSpindash;

  if(enoughSpeed){
    timeWarpTimer+=dt;
    if(Math.random()<.8) spawnParticles(p.x-p.vx*.8,p.y+20,1);

    if(timeWarpTimer>=3.0){
      timeline=timeWarpSign.destination;
      applyTimelineLayout();
      if(titleCardTimer<=0 && !levelComplete) playTheme(themeForTimeline());
      timeWarpSign=null;
      timeWarpTimer=0;
      timeWarpCooldown=1.0;
      timeWarpFlash=.8;
      shake=12;
      p.vx=Math.sign(p.vx||1)*Math.max(speed,10);
      p.invuln=.8;
      spawnParticles(p.x,p.y+20,30);
    }
  }else{
    // Keep the sign active so the player can simply accelerate and try again.
    // Only cancel the current charge, matching the core CD behavior.
    timeWarpTimer=0;
  }
}

function tryHoming(){
  // A Homing Attack is only available when there is a real target.
  // If there is nothing to home to, Space does NOT perform a fallback dash.
  // Nhome stays locked until Sonic touches ground or hits an enemy/target.
  if(p.nhome) return;
  let best=null, bestD=Infinity;
  for(const t of world.homingTargets){
    const dx=t.x-p.x, dy=t.y-(p.y+20);
    const d=Math.hypot(dx,dy);
    if(d<300 && d<bestD){ best=t; bestD=d; }
  }
  if(!best){
    p.nhome=true;
    return;
  }
  const dx=best.x-p.x, dy=best.y-(p.y+20);
  const d=Math.max(1,Math.hypot(dx,dy));
  p.homing=true; p.nhome=false; p.homingTimer=.72;
  p.grounded=false; p.rolling=true; p.speedUnlocked=false;
  const launch=PHYS.homingSpeed;
  p.vx=(dx/d)*launch; p.vy=(dy/d)*launch;
  spawnParticles(p.x,p.y+20,14); shake=3;
}

function platformSurfaceAt(xPrev,xNext,prevBottom,nextBottom){
  let best=null;
  const minX=Math.min(xPrev,xNext)-2, maxX=Math.max(xPrev,xNext)+2;
  // Sample the swept horizontal path so high-speed Sonic cannot tunnel through slopes.
  const samples=Math.max(2,Math.ceil((maxX-minX)/12));
  for(let i=0;i<=samples;i++){
    const x=minX+(maxX-minX)*(i/samples);
    const tMove=(x-xPrev)/((xNext-xPrev)||1);
    const bottom=prevBottom+(nextBottom-prevBottom)*tMove;
    for(const s of world.solids){
      if(x>=s.x && x<=s.x+s.w && s.y<700 && prevBottom<=s.y+10 && bottom>=s.y-2){
        if(best===null || s.y<best) best=s.y;
      }
    }
    for(const s of world.slopes){
      const min=Math.min(s.x1,s.x2), max=Math.max(s.x1,s.x2);
      if(x>=min && x<=max){
        const t=(x-s.x1)/(s.x2-s.x1), y=lerp(s.y1,s.y2,t);
        if(prevBottom<=y+12 && bottom>=y-2 && (best===null || y<best)) best=y;
      }
    }
  }
  return best;
}

function updateSonicTrail(dt){
  for(let i=sonicTrails.length-1;i>=0;i--){
    sonicTrails[i].life-=dt;
    if(sonicTrails[i].life<=0) sonicTrails.splice(i,1);
  }
  trailTimer-=dt;
  if(Math.abs(p.vx)>30 || Math.hypot(p.vx,p.vy)>30){
    if(trailTimer<=0){
      sonicTrails.push({x:p.x,y:p.y,angle:p.angle,life:.20,max:.20});
      if(sonicTrails.length>12) sonicTrails.shift();
      trailTimer=.035;
    }
  }else trailTimer=0;
}

function resolveRaisedTerrainCollision(prevX,prevY,nextX,nextY){
  const halfW=p.w/2,halfH=p.h/2;
  const prevBottom=prevY+halfH, nextBottom=nextY+halfH;
  const dx=nextX-prevX,dy=nextY-prevY;

  // Raised blocks: collide with their vertical face before Sonic can enter them.
  for(const s of world.solids){
    if(s.y>=700) continue;
    const top=s.y, left=s.x, right=s.x+s.w;
    const verticalOverlap=Math.min(prevBottom,nextBottom)<top+s.h && Math.max(prevY-halfH,nextY-halfH)>top;
    if(verticalOverlap){
      if(dx>0 && prevX+halfW<=left && nextX+halfW>=left){
        p.x=left-halfW;p.vx=0;return true;
      }
      if(dx<0 && prevX-halfW>=right && nextX-halfW<=right){
        p.x=right+halfW;p.vx=0;return true;
      }
    }
  }

  // Slopes are treated as continuous ground surfaces. The important part is
  // checking the surface at EVERY movement substep, including when Sonic is
  // already slightly inside it from a previous frame.
  if(dy>=-1){
    let best=null;
    for(const s of world.slopes){
      const lo=Math.min(s.x1,s.x2)-halfW, hi=Math.max(s.x1,s.x2)+halfW;
      if(nextX<lo||nextX>hi) continue;
      const sxPos=clamp(nextX,Math.min(s.x1,s.x2),Math.max(s.x1,s.x2));
      const t=(sxPos-s.x1)/((s.x2-s.x1)||1);
      const surfaceY=lerp(s.y1,s.y2,t);
      // If Sonic's feet reach or penetrate the slope while moving down/right
      // along it, land immediately. The +28 tolerance also catches a fast
      // side-entry into a raised ramp instead of allowing tunnelling.
      if(nextBottom>=surfaceY-2 && prevBottom<=surfaceY+30){
        if(best===null||surfaceY<best) best=surfaceY;
      }
    }
    if(best!==null){
      p.y=best-halfH;p.vy=0;p.grounded=true;p.jumping=false;p.nhome=false;
      return true;
    }
  }
  return false;
}

function movePlayerSwept(){
  const distance=Math.max(Math.abs(p.vx),Math.abs(p.vy));
  const steps=Math.max(1,Math.ceil(distance/2));
  const dx=p.vx/steps,dy=p.vy/steps;
  for(let i=0;i<steps;i++){
    const prevX=p.x,prevY=p.y;
    const nextX=p.x+dx,nextY=p.y+dy;
    p.x=nextX;p.y=nextY;
    if(resolveRaisedTerrainCollision(prevX,prevY,nextX,nextY)) break;
  }
}

function updatePlayer(dt){
  if(hit("r")||hit("R")){reset();return;}
  if(titleCardTimer>0){
    const was=titleCardTimer;
    titleCardTimer=Math.max(0,titleCardTimer-dt);
    if(was>0 && titleCardTimer===0) startGameplayMusic();
    return;
  }
  if(levelComplete){ return; }
  updateTimeTravel(dt);
  levelTime+=dt;
  if(p.invuln>0)p.invuln-=dt;
  if(p.homingTimer>0)p.homingTimer-=dt;


  // Loop handling has priority.
  if(updateLoop(dt)) return;

  const left=down("ArrowLeft"),right=down("ArrowRight");
  const dir=(right?1:0)-(left?1:0);
  if(dir!==0) p.facing=dir;

  // Spin Dash on ground: hold down + Z, release Z to launch.
  if(p.grounded && down("ArrowDown") && (down("z")||down("Z"))){
    p.spindash=true;
    p.spindashCharge=clamp(p.spindashCharge+.45,0,20);
    p.vx*=.75;
    spawnParticles(p.x,p.y+p.h/2,Math.random()<.25?2:0);
  } else if(p.spindash && !down("z")&&!down("Z")){
    const sign=dir||p.facing||Math.sign(p.vx)||1;
    p.vx=sign*(PHYS.spinDashBase+p.spindashCharge*PHYS.spinDashPerCharge);
    p.abilityBoostTimer=999;
    p.speedUnlocked=true;
    p.rolling=true;
    p.spindash=false;
    p.spindashCharge=0;
    spawnParticles(p.x,p.y+p.h/2,14);
    shake=4;
  }

  // Super Peel Out: hold UP + Z, then release Z.
  // It is intentionally faster than Spin Dash and keeps Sonic facing forward.
  if(p.grounded && down("ArrowUp") && (down("z")||down("Z"))){
    p.peel=true;
    p.peelCharge=clamp(p.peelCharge+.65,0,20);
    p.vx*=.80;
    spawnParticles(p.x,p.y+p.h/2,Math.random()<.25?1:0);
  } else if(p.peel && !down("z")&&!down("Z")){
    const sign=dir || p.facing || Math.sign(p.vx)||1;
    p.vx=sign*(PHYS.peelBase+p.peelCharge*.72);
    p.abilityBoostTimer=999;
    p.speedUnlocked=true;
    p.peel=false;p.peelCharge=0;p.rolling=false;
    spawnParticles(p.x,p.y+p.h/2,22);
    shake=6;
  }

  // Aerial Spin Dash: hold Z only. Arrow keys aim the launch vector.
  // Sonic is completely suspended while charging; gravity resumes only after release.
  if(!p.grounded && !p.homing && (down("z")||down("Z"))){
    if(!p.airSpindash){
      p.airSpindash=true;
      p.airSpindashCharge=0;
      p.airAimX=Math.sign(p.vx)||p.facing||1;
      p.airAimY=0;
      p.rolling=true;
    }
    const aimX=(right?1:0)-(left?1:0);
    const aimY=(down("ArrowUp")?-1:0)+(down("ArrowDown")?1:0);
    if(aimX!==0 || aimY!==0){
      const ad=Math.hypot(aimX,aimY)||1;
      p.airAimX=aimX/ad; p.airAimY=aimY/ad;
    }
    p.airSpindashCharge=clamp(p.airSpindashCharge+.55,0,20);
    p.vx=0; p.vy=0;
    spawnParticles(p.x,p.y+p.h/2,Math.random()<.30?2:0);
  } else if(p.airSpindash && !down("z") && !down("Z")){
    const launchSpeed=PHYS.spinDashBase+p.airSpindashCharge*PHYS.spinDashPerCharge;
    p.vx=p.airAimX*launchSpeed;
    p.vy=p.airAimY*launchSpeed;
    p.abilityBoostTimer=999;
    p.speedUnlocked=true;
    p.airSpindash=false;
    p.airSpindashCharge=0;
    p.rolling=true;
    spawnParticles(p.x,p.y+p.h/2,18);
    shake=5;
  }

  // Jump / homing.
  if(hit(" ") && p.grounded && !p.spindash && !p.peel){
    p.vy=PHYS.jump;
    p.grounded=false;p.jumping=true;p.rolling=true;
    spawnParticles(p.x,p.y+p.h/2,8);
  } else if(hit(" ") && !p.grounded){
    tryHoming();
  }

  if(p.grounded){
    p.coyote=.10;
    if(dir!==0){
      const accel=p.rolling?PHYS.accel*.65:PHYS.accel;
      p.vx+=dir*accel;
      // Stronger ground braking: Sonic should feel responsive rather than ice-skating.
      if(dir!==0 && Math.sign(p.vx)!==dir && Math.abs(p.vx)>0) p.vx*=.72;
    }
    // Slope acceleration.
    const g=groundHeightAt(p.x);
    const g2=groundHeightAt(p.x+8);
    if(g<650 && g2<650){
      const slope=(g2-g)/8;
      p.vx+=slope*PHYS.slopeGravity;
    }
    // Momentum system: normal running builds quickly to a fixed cap.
    // Abilities can temporarily exceed the normal running cap, but never beyond
    // the finite boost cap.
    if(!p.spindash && !p.peel && !p.airSpindash){
      if(dir===0) p.vx*=p.speedUnlocked ? .992 : .88;
      const cap=p.speedUnlocked ? PHYS.boostMax : PHYS.maxSpeed;
      p.vx=clamp(p.vx,-cap,cap);
      if(dir===0 && Math.abs(p.vx)<.18){ p.vx=0; p.speedUnlocked=false; }
      if(p.speedUnlocked && Math.abs(p.vx)<1.0 && dir===0){ p.speedUnlocked=false; }
    }
    if(down("ArrowDown") && Math.abs(p.vx)>4) p.rolling=true;
    if(!down("ArrowDown") && Math.abs(p.vx)<2) p.rolling=false;
    p.vy=0;
  }else{
    p.coyote-=dt;
    const airCap=p.speedUnlocked?PHYS.boostMax:PHYS.maxSpeed;
    // Air control may steer Sonic, but a normal jump cannot create extra speed.
    if(dir!==0){
      const before=Math.abs(p.vx);
      p.vx+=dir*PHYS.airAccel;
      if(!p.speedUnlocked && Math.abs(p.vx)>airCap) p.vx=Math.sign(p.vx)*airCap;
      // Never let a jump itself increase horizontal speed above the speed Sonic had when leaving ground.
      if(!p.speedUnlocked && Math.abs(p.vx)>Math.max(before,PHYS.maxSpeed)) p.vx=Math.sign(p.vx)*Math.max(before,PHYS.maxSpeed);
    }
    p.vx=clamp(p.vx,p.speedUnlocked?-PHYS.boostMax:-PHYS.maxSpeed,p.speedUnlocked?PHYS.boostMax:PHYS.maxSpeed);
    p.vy+=PHYS.gravity;
    p.vy=clamp(p.vy,-30,24);
    // Release jump early for variable jump height.
    if(!down(" ") && p.vy<0) p.vy+=PHYS.jumpRelease;
  }

  movePlayerSwept();

  // Finish sign: the level ends when Sonic reaches the post.
  if(!levelComplete && Math.abs(p.x-world.finishSign.x)<45){
    levelComplete=true;
    finishTimer=0;
    startFinishMusic();
    p.vx*=.35;
    spawnParticles(world.finishSign.x,p.y+10,35);
    shake=8;
  }

  // Ring collection.
  for(let i=world.rings.length-1;i>=0;i--){
    const r=world.rings[i];
    if(Math.hypot(p.x-r.x,p.y+20-r.y)<28){
      p.rings++;
      spawnParticles(r.x,r.y,5);
      world.rings.splice(i,1);
    }
  }

  // Homing impact on target.
  if(p.homing){
    for(const t of world.homingTargets){
      if(Math.hypot(p.x-t.x,p.y-t.y)<30){
        p.homing=false;p.nhome=false;p.vy=-7;p.vx=Math.sign(p.vx||p.facing)*Math.max(Math.abs(p.vx)*.34,PHYS.homingRebound);
        spawnParticles(t.x,t.y,18);shake=6;
      }
    }
    if(p.homingTimer<=0)p.homing=false;
  }

  // Robot generators exist only in the Past. Hit them while rolling, Spin Dashing,
  // or with a Homing Attack to destroy them. Destroying all generators changes
  // the future of this stage into a Good Future.
  if(timeline==="past") {
    for(const m of world.machines){
      if(m.destroyed) continue;
      const d=Math.hypot(p.x-m.x,(p.y+20)-m.y);
      if(d<48 && (p.rolling || p.spindash || p.airSpindash || p.homing || Math.abs(p.vx)>10)){
        m.hp--;
        p.vx*=1.05;
        p.vy=-7;
        spawnParticles(m.x,m.y,20);
        shake=7;
        if(m.hp<=0){
          m.destroyed=true;
          spawnParticles(m.x,m.y,40);
        }
      }
    }
  }

  // Springs.
  for(const s of world.springs){
    if(Math.abs(p.x-s.x)<28 && p.y+24>=s.y-10 && p.y+24<=s.y+18 && p.vy>=0){
      p.y=s.y-45;p.vy=-s.power;p.grounded=false;p.jumping=true;
      spawnParticles(s.x,s.y,14);shake=5;
    }
  }

  // Ground + floating-platform collision. Platforms are real standable surfaces.
  if(p.vy>=0){
    const prevBottom=p.y+p.h/2-p.vy;
    const nextBottom=p.y+p.h/2;
    const surface=platformSurfaceAt(p.x-p.vx,p.x,prevBottom,nextBottom);
    if(surface!==null){
      p.y=surface-p.h/2;p.vy=0;p.grounded=true;p.jumping=false;p.nhome=false;
      p.angle=0;
      if(Math.abs(p.vx)>6) p.rolling=true;
      if(p.x>p.lastSafeX+300)p.lastSafeX=p.x;
    }else p.grounded=false;
  }

  // Simple underside/side protection.
  if(p.y>760) respawn();

  // World bounds.
  p.x=clamp(p.x,-450,world.width);
  updateSonicTrail(dt);
}

  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c.sky1);g.addColorStop(1,c.sky2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

function drawForeground(){
  const good=world.machines.every(m=>m.destroyed);
  const showGoodForeground=(timeline==='future'&&good)||(timeline==='present'&&good);
  const bad=timeline==='future'&&!good;
  const forestStart=23200;
  const start=Math.floor((cameraX*.96)/150)-3;
  const end=start+Math.ceil(W/150)+7;
  ctx.save();
  for(let i=start;i<=end;i++){
    const wx=i*150+30, x=wx-cameraX*.96, base=H+18;
    const type=((i%8)+8)%8;
    const inForest=wx>=forestStart;
    ctx.globalAlpha=1;

    if(inForest){
      // Act 2: deep Fuji forest. Tall Japanese-cypress / hinoki-inspired trees.
      // The silhouette changes by era so the foreground always matches the timeline.
      const scale=2.35+(type%3)*.30;
      let trunk,leaf;
      if(bad){ trunk='#29302d'; leaf=type%2?'#303a35':'#39443f'; }
      else if(timeline==='past'){ trunk='#5b4432'; leaf=type%2?'#385737':'#45663f'; }
      else if(showGoodForeground){ trunk='#466044'; leaf=type%2?'#2f824b':'#3f9b58'; }
      else { trunk='#4c513d'; leaf=type%2?'#3f7042':'#4d7e49'; }
      ctx.globalAlpha=.86;
      // Tall hinoki-inspired trunk. The wood stays visible for a long distance,
      // while the foliage begins above the camera so the canopy feels enormous.
      ctx.fillStyle=trunk;
      ctx.beginPath();
      ctx.moveTo(x-7*scale,base);ctx.lineTo(x-9*scale,base-390*scale);
      ctx.lineTo(x+9*scale,base-390*scale);ctx.lineTo(x+7*scale,base);ctx.closePath();ctx.fill();
      ctx.fillStyle=leaf;
      // The upper foliage starts above the top of the screen and hangs into view.
      for(let j=0;j<6;j++){
        const yy=base-(365+j*52)*scale;
        const ww=(72-j*7)*scale;
        ctx.beginPath();ctx.moveTo(x,yy-62*scale);ctx.lineTo(x-ww,yy+38*scale);ctx.lineTo(x+ww,yy+38*scale);ctx.closePath();ctx.fill();
      }
      if(type===2||type===6){ctx.fillStyle=bad?'#46504c':'#737a6d';ctx.beginPath();ctx.moveTo(x+50,base);ctx.lineTo(x+64,base-28);ctx.lineTo(x+92,base-34);ctx.lineTo(x+112,base);ctx.closePath();ctx.fill();}
      continue;
    }

    if(bad){
      ctx.globalAlpha=.70;ctx.fillStyle='#20292b';ctx.strokeStyle='#687674';ctx.lineWidth=5;
      const h=72+(type%4)*18;ctx.fillRect(x-22,base-h,52,h);ctx.fillRect(x+30,base-h+20,30,h-20);
      ctx.beginPath();ctx.moveTo(x-6,base-h);ctx.lineTo(x-6,base-h-40);ctx.lineTo(x+14,base-h-60);ctx.stroke();
      if(type%2===0){ctx.strokeStyle='#87938f';ctx.beginPath();ctx.arc(x+8,base-h-10,22,0,Math.PI*2);ctx.stroke();}
    }else if(timeline==='past'){
      ctx.globalAlpha=.82;
      if(type===0||type===4){ctx.fillStyle='#365d35';for(let j=0;j<4;j++){ctx.beginPath();ctx.arc(x+j*14,base-28-(j%2)*8,17+(j%3)*4,0,Math.PI*2);ctx.fill();}}
      else if(type===1||type===5){ctx.strokeStyle='#507d3f';ctx.lineWidth=4;for(let j=0;j<10;j++){ctx.beginPath();ctx.moveTo(x+j*6,base);ctx.lineTo(x+j*6-4,base-25-(j%3)*5);ctx.stroke();}}
      else{ctx.fillStyle='#666d64';ctx.beginPath();ctx.moveTo(x-28,base);ctx.lineTo(x-13,base-28);ctx.lineTo(x+12,base-34);ctx.lineTo(x+31,base);ctx.closePath();ctx.fill();}
    }else if(showGoodForeground){
      ctx.globalAlpha=.88;
      if(type===0||type===4){ctx.fillStyle='#d9f4dd';ctx.strokeStyle='#4f9e65';ctx.lineWidth=4;ctx.fillRect(x-22,base-72,46,72);ctx.beginPath();ctx.arc(x+1,base-80,21,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(x+1,base-80);ctx.lineTo(x+1,base-99);ctx.stroke();}
      else if(type===1||type===5){ctx.strokeStyle='#31864d';ctx.lineWidth=5;for(let j=0;j<12;j++){ctx.beginPath();ctx.moveTo(x+j*6,base);ctx.lineTo(x+j*6-8,base-46-(j%4)*7);ctx.stroke();}ctx.fillStyle='#4ca967';ctx.beginPath();ctx.arc(x+22,base-33,30,0,Math.PI*2);ctx.arc(x+50,base-27,24,0,Math.PI*2);ctx.fill();}
      else{ctx.fillStyle='#707d73';ctx.beginPath();ctx.moveTo(x-28,base);ctx.lineTo(x-13,base-28);ctx.lineTo(x+12,base-34);ctx.lineTo(x+31,base);ctx.closePath();ctx.fill();}
    }else{
      ctx.globalAlpha=.82;
      if(type===0||type===3){ctx.strokeStyle='#c7a64c';ctx.lineWidth=4;for(let j=0;j<10;j++){ctx.beginPath();ctx.moveTo(x+j*7,base);ctx.lineTo(x+j*7-5,base-34-(j%3)*6);ctx.stroke();}}
      else if(type===1||type===4){ctx.fillStyle='#3f8050';for(let j=0;j<4;j++){ctx.beginPath();ctx.arc(x+j*15,base-28-(j%2)*6,22+(j%2)*3,0,Math.PI*2);ctx.fill();}}
      else{ctx.fillStyle='#68736b';ctx.beginPath();ctx.moveTo(x-28,base);ctx.lineTo(x-13,base-28);ctx.lineTo(x+12,base-34);ctx.lineTo(x+31,base);ctx.closePath();ctx.fill();}
    }
  }
  ctx.restore();ctx.globalAlpha=1;

function drawTitleCard(){
  if(titleCardTimer<=0) return;
  const elapsed=TITLE_CARD_DURATION-titleCardTimer;
  const t=clamp(elapsed/.55,0,1);
  const out=clamp((elapsed-2.35)/.9,0,1);
  ctx.save();
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);

  // A Sonic-CD-inspired zone card: black field, blue vertical strip with a red
  // zig-zag edge, and stacked yellow zone lettering.
  const slide=(1-t)*Math.min(120,W*.16);
  const barX=W*.43-slide;
  const barW=Math.max(54,W*.075);
  ctx.fillStyle='#26288d';ctx.fillRect(barX,0,barW,H);
  ctx.fillStyle='#e51f2b';
  ctx.beginPath();
  ctx.moveTo(barX,0);
  for(let y=0;y<=H+28;y+=32){
    ctx.lineTo(barX+18,y+16);ctx.lineTo(barX,y+32);
  }
  ctx.closePath();ctx.fill();

  const tx=barX+barW+Math.max(24,W*.018)-out*W*.65;
  ctx.textAlign='left';
  ctx.fillStyle='#ffe900';
  ctx.font='900 '+Math.max(34,Math.min(72,W*.095))+'px Arial Narrow,Arial,sans-serif';
  ctx.fillText('FANTASTIC',tx,H*.42);
  ctx.fillText('FUJI',tx,H*.55);
  ctx.fillStyle='#fff';
  ctx.font='900 '+Math.max(28,Math.min(52,W*.065))+'px Arial Narrow,Arial,sans-serif';
  ctx.fillText('ACT '+LEVEL_ACT,tx,H*.68);
  ctx.font='900 '+Math.max(11,Math.min(17,W*.019))+'px monospace';
  ctx.fillText('SONIC THE HEDGEHOG CD',tx+4,H*.76);
  ctx.globalAlpha=.8;
  ctx.font='bold '+Math.max(9,Math.min(13,W*.014))+'px monospace';
  ctx.fillText('LAKE FUJI',tx+4,H*.81);
  ctx.restore();
}

function drawWorld(){
  // Ground blocks
  const goodFuture=world.machines.every(m=>m.destroyed);
  const groundMain=timeline==="past"?"#87623f":timeline==="future"?(goodFuture?"#39a85f":"#284f55"):"#3a9b55";
  const groundTop=timeline==="past"?"#c68a4d":timeline==="future"?(goodFuture?"#8be05e":"#397e78"):"#7acb57";
  ctx.fillStyle=groundMain;
  for(const s of world.solids){
    ctx.fillRect(sx(s.x),sy(s.y),s.w,s.h);
    ctx.fillStyle=groundTop;
    ctx.fillRect(sx(s.x),sy(s.y),s.w,12);
    ctx.fillStyle=groundMain;
  }
  // checker-like dirt
  ctx.fillStyle="rgba(100,70,40,.22)";
  for(const s of world.solids){
    for(let x=s.x;x<s.x+s.w;x+=32)
      for(let y=s.y+20;y<s.y+s.h;y+=32)
        if(((x/32+y/32)|0)%2===0)ctx.fillRect(sx(x),sy(y),16,16);
  }

  // slopes
  ctx.strokeStyle="#7acb57";ctx.lineWidth=14;ctx.lineCap="round";
  for(const s of world.slopes){
    ctx.beginPath();ctx.moveTo(sx(s.x1),sy(s.y1));ctx.lineTo(sx(s.x2),sy(s.y2));ctx.stroke();
  }

  // Loop track and its lower-left entrance / lower-right exit. The visible
  // track matches the physical path Sonic actually follows.
  for(const L of world.loops){
    prepareLoopTrack(L);
    ctx.strokeStyle="#3a9b55";ctx.lineWidth=42;ctx.lineCap='round';ctx.beginPath();
    const pts=L.track.pts;
    ctx.moveTo(sx(pts[0].x),sy(pts[0].y));
    for(let i=1;i<pts.length;i++)ctx.lineTo(sx(pts[i].x),sy(pts[i].y));
    ctx.stroke();
    ctx.strokeStyle="#7acb57";ctx.lineWidth=10;ctx.beginPath();
    ctx.moveTo(sx(pts[0].x),sy(pts[0].y));
    for(let i=1;i<pts.length;i++)ctx.lineTo(sx(pts[i].x),sy(pts[i].y));
    ctx.stroke();
  }

  // springs
  for(const s of world.springs){
    ctx.fillStyle="#e33";ctx.fillRect(sx(s.x-15),sy(s.y-10),30,10);
    ctx.strokeStyle="#fff";ctx.lineWidth=3;
    for(let i=0;i<3;i++){
      ctx.beginPath();ctx.moveTo(sx(s.x-12+i*8),sy(s.y-10));
      ctx.lineTo(sx(s.x-8+i*8),sy(s.y-22));ctx.stroke();
    }
  }

  // rings
  for(const r of world.rings){
    ctx.strokeStyle="#ffd72a";ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(sx(r.x),sy(r.y),9,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle="#fff4a0";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sx(r.x-2),sy(r.y-2),5,-1.2,.8);ctx.stroke();
  }

  // Robot generators in the Past. They are deliberately large and obvious.
  if(timeline==="past") {
    for(const m of world.machines){
      if(m.destroyed) continue;
      const x=sx(m.x), y=sy(m.y);
      ctx.save();
      ctx.translate(x,y);
      ctx.fillStyle="#34343d";ctx.fillRect(-28,-42,56,70);
      ctx.fillStyle="#f4c542";ctx.fillRect(-20,-31,40,9);
      ctx.fillStyle="#7d8cff";ctx.beginPath();ctx.arc(0,-4,15,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#111";ctx.beginPath();ctx.arc(0,-4,7,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="#e44";ctx.lineWidth=4;ctx.strokeRect(-22,10,44,10);
      ctx.fillStyle="#fff";ctx.font="bold 10px Arial";ctx.textAlign="center";ctx.fillText("TIME CORE",0,-48);
      for(let i=0;i<m.hp;i++){ctx.fillStyle="#ffdf55";ctx.fillRect(-18+i*12,27,8,5);}
      ctx.restore();
    }
  }

  // Sonic CD-style time warp signs
  for(const s of world.timeSigns){
    const active = timeWarpSign && timeWarpSign.sign===s;
    const signColor = s.type==="past" ? "#47d7ff" : "#ff4fd8";

    ctx.save();
    ctx.translate(sx(s.x),sy(s.y));
    ctx.strokeStyle="#555";
    ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(0,5);ctx.lineTo(0,48);ctx.stroke();

    ctx.fillStyle=active ? "#fff" : signColor;
    ctx.fillRect(-24,-28,48,30);

    ctx.fillStyle="#111";
    ctx.font="bold 12px Arial";
    ctx.textAlign="center";
    ctx.fillText(s.type.toUpperCase(),0,-9);

    if(active){
      ctx.strokeStyle="#fff";
      ctx.lineWidth=3;
      ctx.strokeRect(-29,-33,58,40);
    }
    ctx.restore();
  }

  // Finish post. Touching it completes the act.
  {
    const s=world.finishSign;
    ctx.save();ctx.translate(sx(s.x),sy(s.y));
    ctx.strokeStyle='#f4f4f4';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,55);ctx.lineTo(0,-8);ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(-34,-40,68,32);
    ctx.fillStyle='#e33';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('GOAL',0,-19);
    ctx.fillStyle='#ffd72a';ctx.beginPath();ctx.arc(0,-2,7,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // homing targets
  for(const t of world.homingTargets){
    ctx.fillStyle="#e33";ctx.beginPath();ctx.arc(sx(t.x),sy(t.y),12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(sx(t.x),sy(t.y),5,0,Math.PI*2);ctx.fill();
  }
}

function drawSonicTrails(){
  for(const t of sonicTrails){
    const a=Math.max(0,t.life/t.max)*.48;
    ctx.save();ctx.globalAlpha=a;ctx.translate(sx(t.x),sy(t.y));ctx.rotate(t.angle);
    ctx.fillStyle='#1166e8';ctx.beginPath();ctx.arc(0,-3,19,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-8,5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawPlayer(){
  ctx.save();
  ctx.translate(sx(p.x),sy(p.y));
  ctx.rotate(p.angle);
  if(p.invuln>0 && Math.floor(time*20)%2===0){ctx.globalAlpha=.4;}
  // shadow
  ctx.fillStyle="rgba(0,0,0,.2)";
  if(p.grounded){ctx.beginPath();ctx.ellipse(0,23,22,6,0,0,Math.PI*2);ctx.fill();}
  // simple blue Sonic-like character
  ctx.fillStyle="#1166e8";
  if(p.rolling||p.jumping||Math.abs(p.vx)>10){
    ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(7,-6,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#111";ctx.beginPath();ctx.arc(9,-6,2,0,Math.PI*2);ctx.fill();
  }else{
    ctx.beginPath();ctx.arc(0,-5,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(5,-9,5,7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#111";ctx.beginPath();ctx.arc(6,-9,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#e33";ctx.fillRect(-16,12,15,7);ctx.fillRect(4,12,15,7);
  }
  ctx.restore();

  // Aerial Spin Dash aiming guide. It stays visible only while charging,
  // and its direction is exactly the direction used when Z is released.
  if(p.airSpindash){
    const len=110+Math.min(90,p.airSpindashCharge*5);
    const ax=sx(p.x), ay=sy(p.y);
    ctx.save();
    ctx.strokeStyle="#fff";
    ctx.globalAlpha=.9;
    ctx.lineWidth=4;
    ctx.setLineDash([10,7]);
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+p.airAimX*len,ay+p.airAimY*len);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(ax+p.airAimX*len,ay+p.airAimY*len,7,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // charge effects
  if(p.spindash||p.peel||p.airSpindash){
    ctx.strokeStyle=(p.spindash||p.airSpindash)?"#fff":"#ffd72a";ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(sx(p.x),sy(p.y),30+Math.sin(time*18)*3,0,Math.PI*2);ctx.stroke();
  }
}

function drawParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.12;q.life-=dt;
    if(q.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,q.life);
    ctx.fillStyle="#fff";ctx.fillRect(sx(q.x),sy(q.y),4,4);
  }
  ctx.globalAlpha=1;
}

function updateCamera(){
  const targetX=p.x-W*.38;
  const targetY=p.y-H*.50;
  cameraX=lerp(cameraX,targetX,.09);
  cameraY=lerp(cameraY,targetY,.07);
  cameraX=clamp(cameraX,-200,world.width-W+250);
  cameraY=clamp(cameraY,-120,400);
}

function render(){
  drawBackground();
  ctx.save();
  if(shake>0){
    ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    shake*=.88;if(shake<.1)shake=0;
  }
  drawWorld();
  drawForeground();
  drawParticles(1/60);
  drawSonicTrails();
  drawPlayer();
  ctx.restore();
  drawTitleCard();

  if(timeWarpFlash>0){
    ctx.fillStyle="rgba(255,255,255,"+Math.min(.9,timeWarpFlash*1.5)+")";
    ctx.fillRect(0,0,W,H);
  }
  if(levelComplete){
    const good=world.machines.length>0 && world.machines.every(m=>m.destroyed);
    const pulse=1+Math.sin(finishTimer*5)*.025;
    ctx.save();
    ctx.fillStyle='rgba(4,8,20,.62)';ctx.fillRect(0,0,W,H);
    // Stage-clear layout inspired by classic Sonic results screens.
    const panelW=Math.min(620,W*.82),panelH=Math.min(360,H*.74);
    const px=(W-panelW)/2,py=(H-panelH)/2;
    ctx.fillStyle='rgba(8,18,38,.92)';ctx.fillRect(px,py,panelW,panelH);
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(px+8,py+8,panelW-16,panelH-16);
    ctx.textAlign='center';
    ctx.fillStyle='#fff';
    ctx.font='900 '+Math.max(22,Math.min(40,W*.045))+'px Arial Narrow,Arial,sans-serif';
    ctx.fillText(good?'SONIC MADE A GOOD FUTURE!':'SONIC GOT THROUGH',W/2,py+72);
    ctx.save();ctx.translate(W/2,py+122);ctx.scale(pulse,pulse);
    ctx.fillStyle='#ffe900';
    ctx.font='900 '+Math.max(30,Math.min(58,W*.065))+'px Arial Narrow,Arial,sans-serif';
    ctx.fillText(LEVEL_NAME,W/2-W/2,0);
    ctx.restore();
    ctx.fillStyle='#fff';
    ctx.font='900 '+Math.max(20,Math.min(34,W*.038))+'px Arial Narrow,Arial,sans-serif';
    ctx.fillText('ACT '+LEVEL_ACT,W/2,py+162);

    const score=p.rings*100;
    const totalSeconds=levelTime;
    const minutes=Math.floor(totalSeconds/60);
    const seconds=(totalSeconds%60).toFixed(2).padStart(5,'0');
    ctx.textAlign='left';ctx.font='900 16px monospace';
    ctx.fillText('SCORE',px+52,py+215);ctx.fillText(String(score).padStart(6,'0'),px+190,py+215);
    ctx.fillText('RINGS',px+52,py+248);ctx.fillText(String(p.rings).padStart(3,'0'),px+190,py+248);
    ctx.fillText('TIME',px+52,py+281);ctx.fillText(minutes+"'"+seconds,px+190,py+281);
    ctx.textAlign='center';ctx.fillStyle='#ffd72a';ctx.font='900 14px monospace';
    ctx.fillText(good?'GOOD FUTURE':'FUTURE NOT SAVED',W/2,py+314);
    ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.fillText('PRESS R TO PLAY AGAIN',W/2,py+340);
    ctx.restore();
  }

  status.innerHTML=
    "TIME: "+timeline.toUpperCase()+
    "<br>SPEED: "+Math.abs(p.vx).toFixed(1)+(p.speedUnlocked?" / BOOST":" / "+PHYS.maxSpeed)+
    "<br>RINGS: "+p.rings+
    "<br>LOOP: "+(p.loopIndex>=0?"ON":"OFF")+
    (timeline==="future"?"<br>FUTURE: "+(world.machines.every(m=>m.destroyed)?"GOOD":"BAD"):"")+
    (timeline==="past"?"<br>TIME CORE: "+(world.machines.every(m=>m.destroyed)?"DESTROYED":"ACTIVE"):"")+
    "<br>"+(p.spindash?"SPINDASH "+Math.round(p.spindashCharge):"")+
    (p.peel?"PEEL OUT (UP+Z) "+Math.round(p.peelCharge):"")+
    (p.airSpindash?"<br>AIR SPINDASH "+Math.round(p.airSpindashCharge):"")+
    (timeWarpSign ? "<br>TIME WARP: "+Math.min(3,timeWarpTimer).toFixed(1)+" / 3.0s" : "");
}

// MUSIC SETUP — each timeline has its own theme. Put these files in Music/FF/.
// Title/clear themes are separate from the Present, Past, Bad Future and Good Future themes.
const music={
  title:new Audio('Music/FF/FantasticFuji_Title.mp3'),
  present:new Audio('Music/FF/FantasticFuji_Present.mp3'),
  past:new Audio('Music/FF/FantasticFuji_Past.mp3'),
  badFuture:new Audio('Music/FF/FantasticFuji_BadFuture.mp3'),
  goodFuture:new Audio('Music/FF/FantasticFuji_GoodFuture.mp3'),
  finish:new Audio('Music/FF/FantasticFuji_StageClear.mp3'),
  goodFinish:new Audio('Music/FF/FantasticFuji_GoodFutureClear.mp3')
};
for(const a of Object.values(music)){a.preload='auto';a.loop=false;}
for(const k of ['present','past','badFuture','goodFuture']) music[k].loop=true;
let musicStarted=false;
let finishMusicStarted=false;
let currentTheme=null;
function stopMusic(except=null){
  for(const a of Object.values(music)) if(a!==except){a.pause();a.currentTime=0;}
}
function playTheme(theme){
  const a=music[theme]; if(!a)return;
  if(currentTheme===theme && !a.paused)return;
  stopMusic(a); currentTheme=theme; a.loop=true; a.play().catch(()=>{});
}
function themeForTimeline(){
  if(timeline==='past') return 'past';
  if(timeline==='future') return world.machines.every(m=>m.destroyed)?'goodFuture':'badFuture';
  return 'present';
}
function startTitleMusic(){
  if(musicStarted)return;
  musicStarted=true;currentTheme='title';stopMusic(music.title);music.title.loop=false;music.title.play().catch(()=>{});
}
function startGameplayMusic(){playTheme(themeForTimeline());}
function startFinishMusic(){
  if(finishMusicStarted)return;
  finishMusicStarted=true;
  const good=world.machines.length>0&&world.machines.every(m=>m.destroyed);
  const a=good?music.goodFinish:music.finish;
  currentTheme=good?'goodFinish':'finish';stopMusic(a);a.loop=false;a.play().catch(()=>{});
}
addEventListener('keydown',()=>{
  startTitleMusic();
  if(titleCardTimer<=0&&!levelComplete) startGameplayMusic();
},{once:false});

let last=performance.now();
let runtimeError=null;
function loop(now){
  const dt=Math.min(Math.max((now-last)/1000,0),.033);last=now;time+=dt;
  try{
    updatePlayer(dt);
    updateCamera();
    render();
  }catch(err){
    runtimeError=err;
    console.error("Sonic engine runtime error:",err);
    // Keep the animation loop alive while showing the actual error instead of
    // leaving the canvas apparently frozen.
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle="rgba(0,0,0,.86)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff";ctx.font="bold 20px monospace";
    ctx.fillText("ENGINE ERROR — PRESS R TO RESET",24,42);
    ctx.font="14px monospace";
    ctx.fillText(String(err && err.message ? err.message : err),24,72);
    ctx.restore();
  }
  pressed.clear();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
